name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build static site
        run: npm run build
      - name: Verify required output
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/.nojekyll
          test -f dist/projects/energy-flexibility/index.html
          test -f dist/projects/retail-allocation/index.html
          test -f dist/projects/mobility-rebalancing/index.html
          test -f dist/projects/airline-fleet/index.html
          test -f dist/projects/telecom-staff/index.html
          test -f dist/projects/healthcare-scheduling/index.html
          test -f dist/data/healthcare/s0m0b0.json
          test -f dist/files/healthcare/healthcare-scheduling-reproducibility.zip
          for study in energy mobility retail airline telecom healthcare; do
            test -f "dist/notebooks/$study.ipynb"
          done
          test -f dist/files/Abdulaziz_Aldoseri_CV.pdf
          test ! -d dist/design-preview
      - name: Upload public build
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
